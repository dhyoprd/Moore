# MooreApp — XcodeGen project definition (ticket #33).
#
# Regenerate the Xcode project from the worktree with:
#     brew install xcodegen && cd MooreApp && xcodegen generate
#
# The iOS app target links the local Moore Swift package products (the 12-module
# umbrella at the worktree root) plus GRDB directly (the app opens the
# DatabaseQueue itself in AppDependencies). See README.md for the full flow.
#
# Signing (ticket #41): automatic development signing for the builder's personal
# team. DEVELOPMENT_TEAM is NOT hardcoded here — Signing.xcconfig (target
# configFiles below) resolves it from MOORE_DEV_TEAM, which the builder sets once
# in the gitignored Signing.local.xcconfig. Full on-device runbook: INSTALL.md.

name: MooreApp
options:
  bundleIdPrefix: com.dhyoprd.moore
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.9"

packages:
  # The local umbrella package (all 12 Moore modules) at the worktree root.
  Moore:
    path: ../
  # GRDB is already a Moore dependency; declared again so the app target can
  # `import GRDB` directly (AppDependencies opens the DatabaseQueue).
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 7.5.0

targets:
  MooreApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Moore
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes: []
        UISupportsDocumentBrowser: false
    configFiles:
      # Personal-team signing injection (ticket #41): maps MOORE_DEV_TEAM
      # (set once in the gitignored Signing.local.xcconfig) to DEVELOPMENT_TEAM
      # for both configs, so the team ID never lands in a tracked file and
      # survives `xcodegen generate` re-runs. Fallback with no local file:
      # DEVELOPMENT_TEAM resolves empty and Xcode asks you to pick a team.
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    settings:
      base:
        # Repo-owner namespace (ticket #41): globally unique, so automatic
        # signing on the builder's personal team registers it without collision.
        PRODUCT_BUNDLE_IDENTIFIER: com.dhyoprd.moore
        PRODUCT_NAME: Moore
        TARGETED_DEVICE_FAMILY: "1"   # iPhone-first per the blueprint
        CODE_SIGN_STYLE: Automatic
        # App writes its SQLite into Application Support; no extra entitlements.
        ENABLE_PREVIEWS: true
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: Sources/Info.plist
    dependencies:
      # GRDB first so `import GRDB` resolves in the app target.
      - package: GRDB
        product: GRDB
      # Moore module products. Foundation/Exercises/Routines are the minimum the
      # Home tracer bullet drives; Workout supplies Materialize + SessionStats.
      # The remaining modules are linked so the full migration chain (0001–0011)
      # and their resources are present at first boot.
      - package: Moore
        product: MooreFoundation
      - package: Moore
        product: MooreExercises
      - package: Moore
        product: MooreRoutines
      - package: Moore
        product: MooreWorkout
      - package: Moore
        product: MooreProgression
      - package: Moore
        product: MooreRest
      - package: Moore
        product: MooreRecords
      # #36: the full-taxonomy cue engine (cue.pr.achieved / cue.pr.summary
      # evaluation, BR-014 gates) behind the celebration surface.
      - package: Moore
        product: MooreCues
      - package: Moore
        product: MooreWarmup
      - package: Moore
        product: MooreSettings

schemes:
  MooreApp:
    build:
      targets:
        MooreApp: all
    run:
      config: Debug
    profile:
      config: Release
